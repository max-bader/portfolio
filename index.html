    <title>Max Bader - Portfolio</title>

    <script>
      // Apply the saved accent before first paint so the theme never flashes.
      (function () {
        var accents = {
          matrix: ['45, 134, 89', '61, 166, 107'],
          cyan: ['34, 158, 189', '56, 199, 224'],
          amber: ['190, 138, 45', '224, 168, 60'],
          violet: ['124, 92, 214', '155, 124, 240'],
          crimson: ['190, 62, 82', '224, 84, 104']
        };
        try {
          var saved = localStorage.getItem('portfolio-accent');
          var accent = accents[saved];
          if (accent) {
            document.documentElement.style.setProperty('--accent-rgb', accent[0]);
            document.documentElement.style.setProperty('--accent-rgb-bright', accent[1]);
            document.documentElement.dataset.accent = saved;
          }
        } catch (e) {
          /* localStorage unavailable — fall back to the default accent. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
