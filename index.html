    <title>Max Bader - Portfolio</title>

    <script>
      // Apply the saved theme + accent before first paint so neither flashes.
      (function () {
        var accents = {
          matrix: { dark: ['45, 134, 89', '61, 166, 107'] },
          cyan: { dark: ['34, 158, 189', '56, 199, 224'] },
          amber: { dark: ['190, 138, 45', '224, 168, 60'] },
          violet: { dark: ['124, 92, 214', '155, 124, 240'] },
          crimson: { dark: ['190, 62, 82', '224, 84, 104'] },
          mono: {
            dark: ['228, 231, 234', '255, 255, 255'],
            light: ['20, 24, 28', '54, 62, 70']
          }
        };
        var root = document.documentElement;
        try {
          var theme = localStorage.getItem('portfolio-theme') === 'light' ? 'light' : 'dark';
          if (theme === 'light') root.dataset.theme = 'light';

          var savedAccent = localStorage.getItem('portfolio-accent');
          var accent = accents[savedAccent];
          if (!accent) return;

          var onPage = accent[theme] || accent.dark;
          var onDark = accent.dark;
          root.style.setProperty('--accent-rgb', onPage[0]);
          root.style.setProperty('--accent-rgb-bright', onPage[1]);
          root.style.setProperty('--accent-on-dark', onDark[0]);
          root.style.setProperty('--accent-on-dark-bright', onDark[1]);
          root.dataset.accent = savedAccent;
        } catch (e) {
          /* localStorage unavailable — fall back to the defaults. */
        }
      })();
    </script>
  </head>
  <body>
    <!--
      DIRECTION CONTRACT — seed cc678c35 · mode: experience · code-led

      THESIS: Max's distinguishing fact is range — six real roles in ~18 months,

      OWN-WORLD: three committed systems at their own routes. /draft cyanotype
      drafting sheet; /graph git branch railroad; /board split-flap concourse.
      One world owns each page — no shared chrome, no reskin.

      STORY: a recruiter mid-triage sees the shape of six overlapping roles in
      one viewport, believes the range is real because dated evidence carries
      it, and leaves remembering the site specifically.

      FIRST VIEWPORT: name at display scale against the world's own ground,
      with the six-role structure already visible below or beside it — never a
      centered hero card. No primary CTA; recall is the goal.

      FORM: candidate 4 of 7 (engineering drawing) assigned by the roll;
      /graph was my top-ranked pick and /board a competitive challenger. All
      three built at the user's request.

      RAISES: color commits at page scale (from the green-field world); line
      weight carries meaning like a real reprographic process (from
      risograph); motion is generated from real data — role dates drive
      geometry — never decorated on top (from the typographic-weather world).

      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, and DESIGN.md
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
