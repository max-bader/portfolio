<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Max Bader — Computer Science student at UC Irvine building web apps and AI tooling. Projects, research, and a portfolio you can drive from the keyboard." />
    <meta name="keywords" content="Max Bader, portfolio, software engineer, UC Irvine, React, AI, machine learning" />
    <meta name="author" content="Max Bader" />
    <meta name="theme-color" content="#000000" />

    <meta property="og:title" content="Max Bader — Software Developer" />
    <meta property="og:description" content="Computer Science @ UC Irvine. Web apps, AI research, and a portfolio you can drive from the keyboard." />
    <meta property="og:type" content="website" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <title>Max Bader - Portfolio</title>

    <script>
      // Apply the saved theme + accent before first paint so neither flashes.
      // Mirrors resolveAccent() in src/lib/theme.js — keep the two in sync.
      (function () {
        var accents = {
          matrix: { dark: ['45, 134, 89', '61, 166, 107'] },
          cyan: { dark: ['34, 158, 189', '56, 199, 224'] },
          amber: { dark: ['190, 138, 45', '224, 168, 60'] },
          violet: { dark: ['124, 92, 214', '155, 124, 240'] },
          crimson: { dark: ['190, 62, 82', '224, 84, 104'] },
          mono: {
            dark: ['228, 231, 234', '255, 255, 255'],
            light: ['20, 24, 28', '54, 62, 70']
          }
        };
        var root = document.documentElement;
        try {
          var theme = localStorage.getItem('portfolio-theme') === 'light' ? 'light' : 'dark';
          if (theme === 'light') root.dataset.theme = 'light';

          var savedAccent = localStorage.getItem('portfolio-accent');
          var accent = accents[savedAccent];
          if (!accent) return;

          var onPage = accent[theme] || accent.dark;
          var onDark = accent.dark;
          root.style.setProperty('--accent-rgb', onPage[0]);
          root.style.setProperty('--accent-rgb-bright', onPage[1]);
          root.style.setProperty('--accent-on-dark', onDark[0]);
          root.style.setProperty('--accent-on-dark-bright', onDark[1]);
          root.dataset.accent = savedAccent;
        } catch (e) {
          /* localStorage unavailable — fall back to the defaults. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
